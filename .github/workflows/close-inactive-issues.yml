name: Close inactive issues

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

concurrency:
  group: close-inactive-issues
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Mark and close inactive issues
        uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          only-issue-labels: "needs info"
          days-before-issue-stale: 14
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          remove-issue-stale-when-updated: true
          operations-per-run: 200
          ascending: true
          stale-issue-message: >-
            This issue is still waiting for info and has had no activity for 14 days.
            It will be closed in 7 days unless someone adds the requested details.
          close-issue-message: >-
            Closing this issue because the requested info did not arrive. Add the
            details in a comment and a maintainer can reopen it.
